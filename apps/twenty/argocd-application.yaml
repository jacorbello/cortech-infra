# NOTE: Application CRs are not self-managed — `kubectl apply -f` this file by hand
# after merging. Editing it in git alone does nothing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: twenty
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jacorbello/cortech-infra.git
    targetRevision: main
    path: apps/twenty/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: crm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  info:
    - name: "sync-wave"
      value: "1"
