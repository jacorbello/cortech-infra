apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: open-parley
  namespace: open-parley
spec:
  hostAPI: http://infisical.infisical.svc.cluster.local
  syncConfig:
    resyncInterval: "60s"
  authentication:
    universalAuth:
      secretsScope:
        # Homelab-wide project. NOT db72a923-… — that one is PlotLens-only.
        projectId: c00e26a9-9389-4cc8-9b74-75f936dfeb81
        envSlug: dev
        secretsPath: /open-parley
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator
  managedSecretReference:
    # Holds DATABASE_URL only — no OIDC secret, this install has no auth.
    secretName: open-parley
    secretNamespace: open-parley
    secretType: Opaque
    # Orphan so an ArgoCD prune or a failed sync can never delete the live
    # secret out from under the running pod.
    creationPolicy: Orphan
