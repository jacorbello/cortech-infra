apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: parley
  namespace: parley
spec:
  hostAPI: http://infisical.infisical.svc.cluster.local
  syncConfig:
    resyncInterval: "60s"
  authentication:
    universalAuth:
      secretsScope:
        # Homelab-wide project. NOT db72a923-… — that one is PlotLens-only, and
        # apps/twenty points at it, so don't copy twenty's file for a new app.
        projectId: c00e26a9-9389-4cc8-9b74-75f936dfeb81
        envSlug: dev
        secretsPath: /parley
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator
  managedSecretReference:
    # Holds DATABASE_URL and OIDC_CLIENT_SECRET; the chart reads both from here.
    secretName: parley
    secretNamespace: parley
    secretType: Opaque
    # Orphan so an ArgoCD prune or a failed sync can never delete the live
    # secret out from under the running pods.
    creationPolicy: Orphan
