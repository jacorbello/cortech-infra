# Helm values for the upstream Parley chart (ghcr.io/lets-parley/charts).
# Consumed by apps/parley/argocd-application.yaml via the $values source ref.

replicaCount: 2

baseURL: https://parley.corbello.io

database:
  existingSecret: parley
  secretKey: DATABASE_URL

auth:
  mode: oidc
  oidc:
    issuer: https://keycloak.corbello.io/realms/parley
    clientID: parley
    # The chart requires a client secret when mode is oidc, so the Keycloak
    # client is registered confidential rather than public.
    existingSecret: parley
    secretKey: OIDC_CLIENT_SECRET

# Parley reads the client address by checking the immediate socket peer against
# this list, then walking X-Forwarded-For right-to-left to the first untrusted
# entry. The peer is always a Traefik pod, whose IP is dynamic, so the CIDR has
# to be the pod network — the chart's NetworkPolicy (networkPolicy.enabled below)
# is what actually restricts who may reach these pods.
#
# There is NO second guard upstream of Traefik right now. This block used to claim
# forwardedHeaders.trustedIPs was narrowed to 192.168.1.100/32; that /32 can never
# match, because the NodePort SNATs the proxy LXC's address away before Traefik
# sees it, so it only stripped X-Forwarded-* cluster-wide. It is 10.42.0.0/16
# again — see k8s/kube-system/traefik-config.yaml and the follow-up issue for the
# upgrade path (PROXY protocol, or externalTrafficPolicy: Local plus a /32).
trustProxyHeaders: true
trustedProxyCIDRs: "10.42.0.0/16,192.168.1.100/32"

# TLS terminates on the proxy LXC (100); routing is a Traefik IngressRoute in
# extras/, not the chart's Ingress — ArgoCD-managed apps here need IngressRoute.
ingress:
  enabled: false

# Both k3s-wrk-1 and k3s-wrk-2 carry this label; the chart's soft
# topologySpreadConstraint needs two eligible nodes to spread the replicas.
nodeSelector:
  role: core-app

# The chart ships this as of 0.4.4 and its docs use exactly our topology as the
# worked example, so we no longer carry a hand-rolled one in extras/.
#
# This is what makes a pod-CIDR trustedProxyCIDRs safe: the pod network is
# reachable from every workload in the cluster, so without a policy any pod
# could open a connection to the Service and name its own client address.
#
# Off by default upstream, deliberately — a NetworkPolicy in a cluster whose CNI
# ignores them does nothing at all. k3s enforces via an embedded kube-router
# controller using iptables DROP, so a denied connection HANGS rather than being
# refused. Test with an explicit --max-time and expect a timeout.
#
# The namespace matches on kubernetes.io/metadata.name, which is the only
# matchable label kube-system carries. A wrong selector fails CLOSED.
networkPolicy:
  enabled: true
  ingressController:
    namespace: kube-system
    podSelector:
      app.kubernetes.io/name: traefik
