# Drop-in for the unit shipped by the noip-duc .deb
# (/lib/systemd/system/noip-duc.service). Goes to
# /etc/systemd/system/noip-duc.service.d/10-cortech.conf on PCT 100.
#
# The packaged unit is already correct about the things that matter — it reads
# EnvironmentFile=/etc/default/noip-duc, runs /usr/bin/noip-duc, Type=simple,
# Restart=on-failure. Only these two deltas are ours, so this is a drop-in
# rather than a full override: an upstream fix to the unit still reaches us.

[Unit]
# Packaged unit orders after network.target, which does not guarantee a
# configured address. noip-duc's first action is a DNS lookup, and LXC 100 is
# onboot=1, so at host boot it races the veth coming up.
# (After= accumulates — network.target from the package is kept.)
After=network-online.target
Wants=network-online.target

[Service]
# Packaged unit takes the default RestartSec (100ms). Restart-looping that fast
# against No-IP looks like an abusive client.
RestartSec=30
