# Global security defaults for every vhost on the proxy.
#
# Lives in conf.d/ deliberately: certbot rewrites the files in sites-available/
# in place, so those can never be repo-authoritative. conf.d/ is certbot-free,
# which makes it the one place shared policy can live and stay in sync with git.
#
# Included from nginx.conf via `include /etc/nginx/conf.d/*.conf;` before
# sites-enabled, so these apply to all server blocks.

# TLS floor. nginx.conf still ships the stock `ssl_protocols TLSv1 TLSv1.1
# TLSv1.2 TLSv1.3`. Certbot-managed vhosts override that with their own
# options-ssl-nginx.conf include, but any vhost lacking that include inherits
# the global value and would accept TLS 1.0/1.1. Setting it here raises the
# floor for those.
# nginx -t emits "duplicate value TLSv1.2/TLSv1.3" because nginx.conf declares
# ssl_protocols in the same http context. Expected and harmless — this directive
# is the later one and governs. Verified with openssl s_client: TLS 1.0 and 1.1
# now get an "alert protocol version" from the server. (Use
# -cipher DEFAULT@SECLEVEL=0 when testing; OpenSSL 3.x otherwise refuses to
# offer those versions client-side and the probe looks like a false pass.)
ssl_protocols TLSv1.2 TLSv1.3;

# HSTS for every site. All public hostnames are TLS-only and redirect :80 → :443
# already, so there is no plaintext vhost this can strand.
#
# CAUTION: nginx add_header inheritance is all-or-nothing. A server or location
# block that declares ANY add_header of its own discards every header inherited
# from here. If you add a per-site header, re-declare this line alongside it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Cheap, non-breaking hardening. Deliberately omits Content-Security-Policy:
# a global CSP would break app UIs and has to be authored per-site.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Do not advertise the nginx patch version in responses or error pages.
server_tokens off;
