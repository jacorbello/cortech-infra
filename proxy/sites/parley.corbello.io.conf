# parley.corbello.io -> K3s Traefik -> parley (parley ns)
server {
    server_name parley.corbello.io;

    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;   # Parley pings every 25s; anything under 75s cuts live boards

    location / {
        proxy_pass http://192.168.1.90:30278;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # DELIBERATELY $remote_addr, NOT $proxy_add_x_forwarded_for like every
        # other site here. Parley walks X-Forwarded-For right-to-left to the
        # first untrusted entry, so appending would leave a caller-supplied
        # value in the chain and hand anyone a free room-code throttle bypass.
        # Overwriting means the only entry we contribute is the real peer.
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header X-Forwarded-Host $server_name;
        proxy_buffering off;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/parley.corbello.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parley.corbello.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = parley.corbello.io) {
        return 301 https://$host$request_uri;
    }

    server_name parley.corbello.io;
    listen 80;
    return 404;
}
