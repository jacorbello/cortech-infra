server {
    listen 80;
    server_name meridian-bridge.co www.meridian-bridge.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name meridian-bridge.co www.meridian-bridge.co;

    ssl_certificate /etc/letsencrypt/live/meridian-bridge.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meridian-bridge.co/privkey.pem;

    root /var/www/meridian-bridge.co;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
