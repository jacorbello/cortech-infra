# PlotLens - Frontend + API
server {
    listen 80;
    server_name plotlens.corbello.io api.plotlens.corbello.io;

    location / {
        proxy_pass http://192.168.1.91:30278;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name plotlens.corbello.io api.plotlens.corbello.io;
    ssl_certificate /etc/letsencrypt/live/plotlens.corbello.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/plotlens.corbello.io/privkey.pem; # managed by Certbot

    client_max_body_size 100m;

    location / {
        proxy_pass https://192.168.1.91:30252;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
    }


}
