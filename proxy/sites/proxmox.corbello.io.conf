server {
    server_name proxmox.corbello.io;
    
    location / {
        # Preserve original host header
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Critical for Proxmox auth
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        
        # WebSocket and HTTP/1.1 support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Disable buffering for real-time updates
        proxy_buffering off;
        proxy_cache off;
        proxy_store off;
        
        # Don't verify SSL for internal connection
        proxy_ssl_verify off;
        
        # Preserve cookies and auth headers
        proxy_pass_header Set-Cookie;
        proxy_pass_header Cookie;
        proxy_pass_header Authorization;
        
        # Pass to Proxmox
        proxy_pass https://192.168.1.52:8006;
        
        # Increased timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ha.corbello.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ha.corbello.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




}
server {
    if ($host = proxmox.corbello.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name proxmox.corbello.io;
    return 404; # managed by Certbot


}