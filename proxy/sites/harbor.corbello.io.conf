# Harbor Container Registry - harbor.corbello.io
# Proxies to K3s Traefik ingress
server {
    listen 80;
    listen [::]:80;
    server_name harbor.corbello.io;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name harbor.corbello.io;

    # TLS configuration (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/harbor.corbello.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harbor.corbello.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Public access - authentication handled by Harbor
    # (Previously restricted to LAN/VPN, now open for GitHub Actions CI)

    # Docker registry requires large file uploads
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Longer timeouts for large image pushes
    proxy_connect_timeout 900;
    proxy_send_timeout 900;
    proxy_read_timeout 900;

    location / {
        # K3s VIP + Traefik NodePort
        proxy_pass http://192.168.1.90:30278;
    }
}
