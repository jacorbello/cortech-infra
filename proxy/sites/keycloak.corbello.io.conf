server {
    server_name keycloak.corbello.io;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://192.168.1.59:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header X-Forwarded-Host $server_name;
        proxy_buffering off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # Block management endpoints from external access
    location /management/ { deny all; return 404; }
    location /metrics { deny all; return 404; }

    listen 443 ssl;
    # SSL certificate will be added by certbot

    ssl_certificate /etc/letsencrypt/live/keycloak.corbello.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/keycloak.corbello.io/privkey.pem; # managed by Certbot
}

server {
    if ($host = keycloak.corbello.io) {
        return 301 https://$host$request_uri;
    }
    server_name keycloak.corbello.io;
    listen 80;
    return 404;


}
