apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: snmp-exporter
    app.kubernetes.io/component: exporter
    release: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: snmp-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snmp-exporter
        release: prometheus
    spec:
      containers:
      - name: snmp-exporter
        image: prom/snmp-exporter:v0.30.1
        # ponytail: no ConfigMap — the image's bundled snmp.yml already defines the
        # public_v2 auth and if_mib module, which is all a switch needs. Mount a
        # custom snmp.yml only if a vendor-specific MIB is ever required.
        ports:
        - name: metrics
          containerPort: 9116
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
