apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: snmp-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: snmp-exporter
    app.kubernetes.io/component: exporter
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: snmp-exporter
  endpoints:
  # The exporter is a proxy: it scrapes the switch over SNMP and re-exposes the
  # result. `instance` is relabelled to the switch so metrics are attributed to
  # the device, not to the exporter pod.
  - port: metrics
    path: /snmp
    interval: 60s
    scrapeTimeout: 30s
    params:
      target:
      - "192.168.1.56"   # sg300 core switch — see docs/switch-sg300.md
      auth:
      - "public_v2"
      module:
      - "if_mib"
    relabelings:
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: device
      replacement: sg300
  # Exporter's own health/process metrics.
  - port: metrics
    path: /metrics
    interval: 60s
